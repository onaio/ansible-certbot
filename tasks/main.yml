---
- name: Install certbot on Debian
  ansible.builtin.include_tasks: debian.yml
  when: ansible_os_family == 'Debian'
- name: Make port 80 available for certbot standalone to work
  when: certbot_plugin == "standalone" and certbot_create_certs|bool

  block:
    - name: Stop webserver
      ansible.builtin.service:
        name: "{{ certbot_webserver_installed }}"
        state: stopped
      failed_when: false

    - name: Check whether port 80 is available
      ansible.builtin.wait_for:
        port: 80
        state: stopped
        timeout: "{{ certbot_waitfor_port_seconds }}"
- name: Create and install the certificate with certbot
  ansible.builtin.command: >-
    certbot --{{ certbot_plugin }}
    {{ (certbot_install_cert) | ternary('', 'certonly') }}
    {{ (certbot_redirect_http) | ternary('--redirect', '') }}
    -d {{ certbot_site_names | join(' -d ') }} -m {{ certbot_mail_address }}
    --agree-tos --noninteractive --text --cert-name {{ certbot_cert_name }}
  changed_when: true
  retries: 3
  delay: 5
  when: certbot_create_certs|bool

- name: Copy the certificate files
  ansible.builtin.include_tasks: copy-files.yml
  when: certbot_create_certs

- name: Set up certificate renewal
  ansible.builtin.include_tasks: "autorenew-{{ certbot_renew_method }}.yml"

- name: Start webserver
  ansible.builtin.service:
    name: "{{ certbot_webserver_installed }}"
    state: started
  failed_when: false
  when: certbot_plugin == "standalone" and certbot_create_certs|bool
