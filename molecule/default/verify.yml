---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Run certbot
      ansible.builtin.command: certbot --version
      changed_when: false

    - name: Read the renewal timer state
      ansible.builtin.command: systemctl is-enabled certbot-renew.timer
      register: renew_timer
      changed_when: false

    - name: Assert the renewal timer is enabled
      ansible.builtin.assert:
        that:
          - renew_timer.stdout == 'enabled'
